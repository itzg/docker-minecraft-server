services:
  minecraft:
    image: itzg/minecraft-server:java25
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: true
      MOD_PLATFORM: AUTO_CURSEFORGE
      CF_SLUG: "custom"
      CF_MODPACK_ZIP: "/downloads/modpacks/PO3-3.5.1.zip"
      APPLY_CLEANROOM: true
      # Mod needed for this pack
      CF_FORCE_INCLUDE_MODS: hwyla
      MEMORY: 8G
      OVERRIDE_SERVER_PROPERTIES: true
      LEVEL_TYPE: botania-skyblock
    volumes:
      - ./downloads:/downloads
      - ./data:/data
      # Uses managed volume by default
      #- mc-data:/data    

# Managed volume by default
#volumes:
  #mc-data:
