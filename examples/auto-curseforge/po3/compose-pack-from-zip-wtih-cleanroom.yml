name: po3-from-zip-file-with-cleanroom

services:
  minecraft:
    stop_grace_period: 20s
    image: itzg/minecraft-server:java25
    container_name: po3
    tty: true
    stdin_open: true
    # Can change to a relative path like
    # ./server-files:/data
    # to use a host directory
    volumes:
      - ./downloads:/downloads
      - ./server:/data
      # Uses managed volume by default
      #- mc-data:/data
    ports:
      - "25565:25565"
    restart: unless-stopped
    environment:
      EULA: true
      MOD_PLATFORM: AUTO_CURSEFORGE
      CF_MODPACK_ZIP: "/downloads/modpacks/PO3-3.5.1.zip"
      CF_SLUG: "project-ozone-3-a-new-way-forward"
      APPLY_CLEANROOM: true
      #CLEANROOM_LOADER_VERSION: "0.7.0-alpha"
      CLEANROOM_INSTALLER_VERSION: "0.3.0"
      #CLEANROOM_FORCE_REINSTALL: true
      # Mod needed for this pack
      CF_FORCE_INCLUDE_MODS: hwyla
      CF_API_KEY: $XX$XX$X.XXXXX.XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      MEMORY: 8G
      OVERRIDE_SERVER_PROPERTIES: true
      LEVEL_TYPE: botania-skyblock

# Managed volume by default
#volumes:
  #mc-data:
